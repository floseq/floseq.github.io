<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada · Florencia Sequeira</title>
    <!-- Esta página no debe aparecer en Google -->
    <meta name="robots" content="noindex" />
    <!-- Las rutas empiezan con "/" porque esta página puede abrirse desde
         cualquier dirección (por ejemplo /proyectos/algo) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="stylesheet" href="/estilos.css" />
  </head>
  <body>
    <header class="cabecera">
      <a class="marca" href="/">Florencia Sequeira</a>
    </header>

    <!-- Se muestran los dos idiomas a la vez, así no hace falta script.js -->
    <main class="error">
      <p class="error__numero">404</p>
      <h1>Esta página no existe.</h1>
      <p class="error__en" lang="en">This page doesn’t exist.</p>
      <div class="botones">
        <a class="pill" href="/">Volver al inicio · Back to home</a>
        <a class="pill" href="/#proyectos">Ver proyectos · See projects</a>
      </div>
    </main>
  </body>
</html>
